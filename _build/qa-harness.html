<!doctype html>
<!-- TEMPORARY QA HARNESS — not part of the site, deleted before commit. -->
<html><head><meta charset="utf-8"><title>qa</title>
<style>html,body{margin:0;background:#fff;font:12px monospace}#out{white-space:pre}</style>
</head><body>
<div id="out">running…</div>
<script>
const q = new URLSearchParams(location.search);
const page = q.get('page') || 'index.html';
const W = parseInt(q.get('w') || '1440', 10);
const H = parseInt(q.get('h') || '900', 10);

const f = document.createElement('iframe');
f.style.cssText = 'border:0;position:absolute;left:0;top:30px';
f.width = W; f.height = H; f.src = '/' + page;
document.body.appendChild(f);

function report(lines){ document.getElementById('out').textContent = 'QA::' + lines.join(' ;; '); }

f.onload = () => setTimeout(() => {
  const d = f.contentDocument, w = f.contentWindow;
  const out = [];
  const vw = d.documentElement.clientWidth;

  // 1. Horizontal page overflow
  const sw = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
  if (sw > vw + 1) out.push(`OVERFLOW page scrollWidth ${sw} > viewport ${vw}`);

  // 2. Individual elements sticking out of the viewport
  const wide = [];
  d.querySelectorAll('body *').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    const cs = w.getComputedStyle(el);
    if (cs.position === 'fixed') return;
    if (r.right > vw + 2 || r.left < -2) {
      if (/auto|scroll|hidden/.test(cs.overflowX)) return;
      let p = el.parentElement, scrollable = false;
      while (p && p !== d.body) {
        const pcs = w.getComputedStyle(p);
        if (/auto|scroll|hidden/.test(pcs.overflowX)) { scrollable = true; break; }
        p = p.parentElement;
      }
      if (scrollable) return;
      wide.push(`${el.tagName.toLowerCase()}.${(el.className||'').toString().split(' ')[0]} L${Math.round(r.left)} R${Math.round(r.right)}`);
    }
  });
  if (wide.length) out.push('OFFSCREEN ' + wide.length + ': ' + wide.slice(0,8).join(' | '));

  // 3. Touch targets under 44px
  const small = [];
  d.querySelectorAll('a,button,input,select,summary').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width === 0 || r.height === 0) return;
    const cs = w.getComputedStyle(el);
    if (cs.visibility === 'hidden') return;
    if (el.closest('.breadcrumb,.footbar,.topbar,.foot__list,.nav__menu,.small,.dashnav')) return;
    if (el.tagName === 'A' && el.closest('p,li,dd,td,label,.card__body,.agenda__desc,.field__hint,.securenote,.notice')) return;
    const lab = el.closest('label');
    const hh = lab ? Math.max(r.height, lab.getBoundingClientRect().height) : r.height;
    if (hh < 24) small.push(`${el.tagName.toLowerCase()}"${(el.textContent||'').trim().slice(0,18)}" h${Math.round(hh)}`);
  });
  if (small.length) out.push('SMALLTAP ' + small.length + ': ' + small.slice(0,6).join(' | '));

  // 4. Content still hidden after reveal (the bug class we just fixed)
  const hidden = [];
  d.querySelectorAll('[data-reveal],[data-reveal-group]>*').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.bottom < 0 || r.top > d.documentElement.clientHeight) return;  // off-screen: hidden is correct
    const cs = w.getComputedStyle(el);
    if (parseFloat(cs.opacity) < 0.95) hidden.push(el.tagName.toLowerCase()+'.'+(el.className||'').toString().split(' ')[0]);
  });
  if (hidden.length) out.push('HIDDEN ' + hidden.length + ': ' + hidden.slice(0,6).join(' | '));

  // 5. Low-contrast text (rough luminance delta against nearest painted bg)
  const lum = c => { const m=c.match(/[\d.]+/g); if(!m) return null;
    const [r,g,b]=m.slice(0,3).map(Number).map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
    return 0.2126*r+0.7152*g+0.0722*b; };
  const bgOf = el => { let p=el; while(p){ const b=w.getComputedStyle(p).backgroundColor;
    if(b && !/transparent/.test(b)){ const m=b.match(/[\d.]+/g);
      const a = m && m.length>3 ? parseFloat(m[3]) : 1;
      if (a >= 0.5) return b; }
    p=p.parentElement; } return 'rgb(247,240,225)'; };
  const low = [];
  d.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,td,th,a,span,div,dt,dd,label').forEach(el => {
    const txt = Array.from(el.childNodes).filter(n=>n.nodeType===3).map(n=>n.textContent.trim()).join('');
    if (txt.length < 2) return;
    const cs = w.getComputedStyle(el);
    if (cs.visibility==='hidden' || cs.display==='none' || parseFloat(cs.opacity)<0.5) return;
    const r = el.getBoundingClientRect(); if (!r.width || !r.height) return;
    if (el.classList.contains('foil') || cs.webkitTextFillColor === 'rgba(0, 0, 0, 0)') return;
    const lf = lum(cs.color), lb = lum(bgOf(el));
    if (lf===null||lb===null) return;
    const ratio = (Math.max(lf,lb)+0.05)/(Math.min(lf,lb)+0.05);
    const size = parseFloat(cs.fontSize), bold = parseInt(cs.fontWeight,10) >= 600;
    const need = (size >= 24 || (size >= 18.66 && bold)) ? 3 : 4.5;
    if (ratio < need) low.push(`${el.tagName.toLowerCase()}.${(el.className||'').toString().split(' ')[0]} ${ratio.toFixed(2)}:1 need${need} "${txt.slice(0,22)}"`);
  });
  if (low.length) out.push('CONTRAST ' + low.length + ': ' + low.slice(0,8).join(' | '));

  report(out.length ? out : ['CLEAN']);
}, 1600);
</script>
</body></html>
